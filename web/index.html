<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUXE Shopping Assistant — POC</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f3f4f6;
        color: #111827;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      header { text-align: center; padding: 2rem 1rem 0.5rem; }
      header h1 { margin: 0; font-size: 1.5rem; }
      header p { margin: 0.25rem 0 0; color: #6b7280; font-size: 0.9rem; }

      .chat {
        width: min(30rem, 100%);
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 0.75rem;
        margin: 1rem;
        overflow: hidden;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
      }
      .messages { flex: 1; padding: 1rem; overflow-y: auto; }
      .typing { font-size: 0.875rem; color: #9ca3af; margin-bottom: 0.5rem; }

      .message { margin-bottom: 0.75rem; }
      .message-user { text-align: right; }
      .message-user p {
        display: inline-block;
        background: #111827;
        color: #fff;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        margin: 0;
      }
      .message-bot { text-align: left; }
      .message-bot p {
        display: inline-block;
        background: #e5e7eb;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        margin: 0;
      }
      .note { font-size: 0.875rem; color: #6b7280; margin: 0 0 0.5rem; }

      .products {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }
      .product {
        border: 1px solid #e5e7eb;
        border-radius: 0.5rem;
        padding: 0.5rem;
      }
      .product img {
        height: 5rem;
        width: 100%;
        object-fit: cover;
        border-radius: 0.25rem;
      }
      .product p { font-size: 0.75rem; font-weight: 600; margin: 0.25rem 0 0; }
      .product .price { color: #6b7280; font-weight: 400; }

      .input { display: flex; gap: 0.5rem; padding: 0.75rem; border-top: 1px solid #e5e7eb; }
      .input input {
        flex: 1;
        padding: 0.5rem 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        font: inherit;
      }
      .input button {
        background: #111827;
        color: #fff;
        border: none;
        border-radius: 0.5rem;
        padding: 0 1rem;
        cursor: pointer;
        font: inherit;
      }
      .input button:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <header>
      <h1>LUXE Shopping Assistant</h1>
      <p>Proof of concept — ask about the catalog in plain English.</p>
    </header>

    <div class="chat">
      <div class="messages" id="messages"></div>
      <form class="input" id="form">
        <input id="input" type="text" placeholder="e.g. men's shirts under 2000" autocomplete="off" />
        <button id="send" type="submit">Send</button>
      </form>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>

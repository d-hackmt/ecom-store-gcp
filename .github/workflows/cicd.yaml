name: Test and Deploy to Google Cloud Run

on:
  push:
    branches: [main]

env:
  REGION: us-central1
  REPO: luxe
  INGESTION_SERVICE: luxe-ingestion
  RETRIEVAL_SERVICE: luxe-retrieval

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        # GROQ_API_KEY is needed just to *import* the app: backend/chatbot/guardrails.py
        # constructs a Groq client at module import time. The tests themselves mock every
        # DB and LLM call, so nothing real is contacted.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push ingestion image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/ingestion:${{ github.sha }}"
          docker build -f services/ingestion/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Build and push retrieval image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/retrieval:${{ github.sha }}"
          docker build -f services/retrieval/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      # Ingestion deploys first with a permissive CORS origin, then gets
      # tightened once retrieval's real URL is known (see the last step) —
      # Cloud Run doesn't hand out a stable URL before first deploy.
      - name: Deploy ingestion service
        run: |
          gcloud run deploy ${{ env.INGESTION_SERVICE }} \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/ingestion:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances=1 \
            --cpu-boost \
            --set-env-vars "MONGO_URI=${{ secrets.MONGO_URI }},GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},LOGFIRE_API_KEY=${{ secrets.LOGFIRE_API_KEY }},GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},PORTKEY_API_KEY=${{ secrets.PORTKEY_API_KEY }},PORTKEY_GROQ_PROVIDER=${{ secrets.PORTKEY_GROQ_PROVIDER }},ALLOWED_ORIGINS=*"

      - name: Get ingestion URL
        id: ingestion_url
        run: echo "url=$(gcloud run services describe ${{ env.INGESTION_SERVICE }} --region ${{ env.REGION }} --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Deploy retrieval service
        run: |
          gcloud run deploy ${{ env.RETRIEVAL_SERVICE }} \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/retrieval:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances=1 \
            --cpu-boost \
            --set-env-vars "MONGO_URI=${{ secrets.MONGO_URI }},GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},LOGFIRE_API_KEY=${{ secrets.LOGFIRE_API_KEY }},GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},PORTKEY_API_KEY=${{ secrets.PORTKEY_API_KEY }},PORTKEY_GROQ_PROVIDER=${{ secrets.PORTKEY_GROQ_PROVIDER }},INGESTION_SERVICE_URL=${{ steps.ingestion_url.outputs.url }},ALLOWED_ORIGINS=*"

      - name: Get retrieval URL
        id: retrieval_url
        run: echo "url=$(gcloud run services describe ${{ env.RETRIEVAL_SERVICE }} --region ${{ env.REGION }} --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Tighten ingestion CORS to retrieval's real URL
        run: |
          gcloud run services update ${{ env.INGESTION_SERVICE }} \
            --region ${{ env.REGION }} \
            --update-env-vars "ALLOWED_ORIGINS=${{ steps.retrieval_url.outputs.url }}"

      - name: Print deployed URLs
        run: |
          echo "Retrieval (storefront): ${{ steps.retrieval_url.outputs.url }}"
          echo "Ingestion (API):        ${{ steps.ingestion_url.outputs.url }}"
